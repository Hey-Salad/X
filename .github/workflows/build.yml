name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Sanity check HeySaladX CLI
        run: npm run heysaladx -- --list-agents
        
      - name: Test HeySaladX plain mode
        run: npm run heysaladx -- --plain --list-agents

  agents-python:
    name: Agents (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        working-directory: agents
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile agents
        run: python -m compileall agents
